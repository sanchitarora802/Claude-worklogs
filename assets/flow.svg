<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="How it works: you chat, Claude replies, a hook runs, it reads new lines only, and updates the log">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fde68a"/>
    </marker>
  </defs>
  <rect width="1000" height="170" rx="22" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- step boxes: 5 x 160 wide, 34 gap -->
    <g fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5">
      <rect x="28" y="35" width="160" height="100" rx="16"/>
      <rect x="222" y="35" width="160" height="100" rx="16"/>
      <rect x="416" y="35" width="160" height="100" rx="16"/>
      <rect x="610" y="35" width="160" height="100" rx="16"/>
      <rect x="804" y="35" width="168" height="100" rx="16" fill="#fbbf24" fill-opacity="0.22" stroke="#fde68a" stroke-opacity="0.7"/>
    </g>

    <g font-size="34">
      <text x="108" y="82">💬</text>
      <text x="302" y="82">🤖</text>
      <text x="496" y="82">🪝</text>
      <text x="690" y="82">🔍</text>
      <text x="888" y="82">📒</text>
    </g>

    <g font-size="17" font-weight="600" fill="#ffffff">
      <text x="108" y="114">You chat</text>
      <text x="302" y="114">Claude replies</text>
      <text x="496" y="114">Hook runs</text>
      <text x="690" y="114">Reads new lines</text>
      <text x="888" y="114">Updates the log</text>
    </g>

    <g stroke="#fde68a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
      <line x1="192" y1="85" x2="216" y2="85"/>
      <line x1="386" y1="85" x2="410" y2="85"/>
      <line x1="580" y1="85" x2="604" y2="85"/>
      <line x1="774" y1="85" x2="798" y2="85"/>
    </g>
  </g>
</svg>
